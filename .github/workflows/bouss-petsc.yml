name: Bouss PETSc probe

# Exploratory job: can the 2D Boussinesq (PETSc + MPI) code be built and run
# on GitHub Actions?  Uses an ubuntu:26.04 container because 26.04 is the first
# Ubuntu release whose apt PETSc (3.24) meets the >= 3.23 requirement in
# examples/bouss/README.txt.  The image's own gfortran must be used (not
# setup-fortran) so GeoClaw is compiled by the same compiler that produced
# PETSc's Fortran .mod files (`use petscksp`).
on:
  push:
    branches: [ "bouss-petsc-ci" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bouss-petsc:
    name: bouss - ubuntu:26.04 - apt PETSc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ubuntu:26.04
      # Open MPI's shared-memory transport fails with the 64 MB Docker default.
      options: --shm-size=1g

    env:
      DEBIAN_FRONTEND: noninteractive
      # Debian/Ubuntu PETSc layout: no PETSC_ARCH.
      PETSC_DIR: /usr/lib/petsc
      CLAW_MPIEXEC: mpiexec
      CLAW_MPIFC: mpif90
      BOUSS_MPI_PROCS: 2
      OMP_NUM_THREADS: 2
      # Container jobs run as root, which Open MPI refuses by default.
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1

    steps:
    # git must exist before actions/checkout, otherwise it falls back to a
    # tarball download without submodules.
    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates git make pkg-config gcc g++ gfortran \
          python3 python3-dev python3-venv petsc-dev

    - name: Checkout Clawpack
      uses: actions/checkout@v7.0.1
      with:
        repository: clawpack/clawpack
        ref: master
        submodules: true

    - name: Checkout GeoClaw branch
      uses: actions/checkout@v7.0.1
      with:
        path: geoclaw

    # ${{ github.workspace }} is the host path; inside the container the
    # workspace is $GITHUB_WORKSPACE, so set CLAW from the shell.
    - name: Set CLAW and PETSC_OPTIONS
      run: |
        echo "CLAW=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        echo "PETSC_OPTIONS=-options_file $GITHUB_WORKSPACE/geoclaw/examples/bouss/petscMPIoptions" >> "$GITHUB_ENV"

    - name: Toolchain diagnostics
      run: |
        set -x
        gfortran --version
        mpif90 --version
        mpiexec --version
        ls -l "$PETSC_DIR" || true
        readlink -f "$PETSC_DIR" || true
        find / -name 'PETSc.pc' -not -path '/proc/*' 2>/dev/null || true
        grep -E 'define PETSC_VERSION_(MAJOR|MINOR|SUBMINOR)' \
          "$PETSC_DIR/include/petscversion.h" || true
        # gfortran writes its module-format version in the gzipped .mod
        # header; it must match the compiler used for GeoClaw.
        mod=$(find "$(readlink -f "$PETSC_DIR")" -name 'petscksp.mod' | head -1)
        echo "petscksp.mod: $mod"
        [ -n "$mod" ] && zcat "$mod" | head -c 80; echo
        PKG_CONFIG_PATH="$PETSC_DIR/lib/pkgconfig" \
          pkg-config --modversion --libs-only-L --libs-only-l PETSc || true

    - name: Install clawpack python
      run: |
        python3 -m venv "$RUNNER_TEMP/venv"
        . "$RUNNER_TEMP/venv/bin/activate"
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        pip install --upgrade pip
        pip install meson-python ninja pytest numpy pandas xarray scipy netCDF4
        cd "$CLAW"
        pip install --no-build-isolation --editable .

    - name: make check
      run: |
        cd "$CLAW/geoclaw/examples/bouss/radial_flat"
        make check

    - name: Build xgeoclaw (bouss)
      run: |
        cd "$CLAW/geoclaw/examples/bouss/radial_flat"
        make .exe

    # Smoke run only (no comparison): a few seconds of simulated time to see
    # that PetscInitialize, the MPI linear solver server, and the KSP solve
    # all work under mpiexec in the container.
    - name: Smoke run (short)
      run: |
        cd "$CLAW/geoclaw/examples/bouss/radial_flat"
        python -c "
        import setrun
        rd = setrun.setrun()
        rd.clawdata.tfinal = 10.
        rd.clawdata.num_output_times = 1
        rd.write()
        "
        # Run in place: setrun's topo file and flagregion file are relative.
        "$CLAW_MPIEXEC" -n "$BOUSS_MPI_PROCS" ./xgeoclaw
        ls -l fort.*
        # amr2.f90 points PETSc's stdout at the timing unit, so the solver
        # server statistics and -options_view table land in timing.txt.
        sed -n '/MPI linear solver server statistics/,/End of PETSc Option Table/p' timing.txt

    # Relative path: ${{ github.workspace }} is the host path in container jobs.
    - name: Upload run output
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: bouss_petsc_probe
        path: |
          geoclaw/examples/bouss/radial_flat/fort.*
          geoclaw/examples/bouss/radial_flat/*.data
          geoclaw/examples/bouss/radial_flat/timing.*
        if-no-files-found: ignore
