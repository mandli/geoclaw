name: Test GeoClaw Boussinesq (PETSc)

# Tests for the 2D Boussinesq solvers (src/2d/bouss), which need PETSc and MPI.
# See dev/design/bouss_ci_roadmap.md.
#
# Runs in an ubuntu:26.04 container because 26.04 is the first Ubuntu release
# whose apt PETSc (3.24) meets the >= 3.23 requirement in
# examples/bouss/README.txt.  The image's own gfortran must be used (not
# setup-fortran) so GeoClaw is compiled by the same compiler that produced
# PETSc's Fortran .mod files (`use petscksp`).
#
# Per-PR runs are limited to bouss paths.  The bouss build also compiles shared
# amrclaw and src/2d/shallow sources, which this filter cannot see; the nightly
# run covers those.
on:
  push:
    branches: [ "master", "bouss-petsc-ci" ]
    paths:
      - 'src/2d/bouss/**'
      - 'examples/bouss/**'
      - '.github/workflows/bouss-petsc.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/2d/bouss/**'
      - 'examples/bouss/**'
      - '.github/workflows/bouss-petsc.yml'
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bouss-tests:
    name: bouss - ubuntu:26.04 - gcc ${{ matrix.build }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ubuntu:26.04
      # Open MPI's shared-memory transport fails with the 64 MB Docker default.
      options: --shm-size=1g
    strategy:
      fail-fast: false
      matrix:
        build: [debug, opt]

    # Container jobs otherwise run steps with `sh -e` (dash), which has no
    # `source`.  `shell: bash` runs `bash --noprofile --norc -eo pipefail`, so
    # avoid pipes into commands that exit early (e.g. `head`): SIGPIPE upstream
    # fails the step.
    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive
      # Debian/Ubuntu PETSc layout: no PETSC_ARCH.
      PETSC_DIR: /usr/lib/petsc
      CLAW_MPIEXEC: mpiexec
      CLAW_MPIFC: mpif90
      BOUSS_MPI_PROCS: 2
      # Fail, rather than skip, if the PETSc/MPI setup is not usable.
      GEOCLAW_REQUIRE_BOUSS: 1
      # Container jobs run as root, which Open MPI refuses by default.
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1

    steps:
    # git must exist before actions/checkout, otherwise it falls back to a
    # tarball download without submodules.
    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates git make pkg-config gcc g++ gfortran \
          python3 python3-dev python3-venv petsc-dev

    - name: Checkout Clawpack
      uses: actions/checkout@v7.0.1
      with:
        repository: clawpack/clawpack
        ref: master
        submodules: true

    # TEMPORARY: ClawpackTestRunner.run_code(runexe=...) is in
    # clawpack/clawutil#210.  Remove this step once that merges and the
    # clawutil submodule in clawpack/clawpack is bumped past it.
    - name: Checkout clawutil with runexe support
      uses: actions/checkout@v7.0.1
      with:
        repository: mandli/clawutil
        ref: test-runner-runexe
        path: clawutil

    - name: Checkout GeoClaw branch
      uses: actions/checkout@v7.0.1
      with:
        path: geoclaw

    # ${{ github.workspace }} is the host path; inside the container the
    # workspace is $GITHUB_WORKSPACE, so set CLAW from the shell.
    - name: Set CLAW and PETSC_OPTIONS
      run: |
        echo "CLAW=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        echo "PETSC_OPTIONS=-options_file $GITHUB_WORKSPACE/geoclaw/examples/bouss/petscMPIoptions" >> "$GITHUB_ENV"

    - name: Toolchain versions
      run: |
        gfortran --version | sed -n 1p
        grep -E 'define PETSC_VERSION_(MAJOR|MINOR|SUBMINOR)' \
          "$PETSC_DIR/include/petscversion.h"
        # gfortran's module-format version must match PETSc's .mod files.
        gzip -dc "$PETSC_DIR/include/petscksp.mod" | sed -n 1p

    - name: Install clawpack python
      run: |
        python3 -m venv "$RUNNER_TEMP/venv"
        . "$RUNNER_TEMP/venv/bin/activate"
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        pip install --upgrade pip
        pip install meson-python ninja pytest numpy pandas xarray scipy netCDF4
        cd "$CLAW"
        pip install --no-build-isolation --editable .

    - name: Run Boussinesq tests
      run: |
        cd "$CLAW/geoclaw"
        source .github/scripts/set_test_env.sh regression gcc "${{ matrix.build }}"
        echo "FFLAGS: $FFLAGS"
        echo "OMP_NUM_THREADS: $OMP_NUM_THREADS"
        pytest --basetemp="$CLAW/geoclaw/pytest_tmp" -vv -s -o addopts="" \
          -m "bouss"

    # Relative path: ${{ github.workspace }} is the host path in container jobs.
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test_results_bouss_${{ matrix.build }}
        path: geoclaw/pytest_tmp
        if-no-files-found: ignore
